name: ci-golang-workflow
on: 
  pull_request:
    branches: 
      - develop
jobs:
    check-application:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                go-version: [1.20,1.22]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                go-version: ${{ matrix.go-version }}  
            - name: go test
              run: go run math.go